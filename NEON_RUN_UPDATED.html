<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>DIY Motion Controller</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.hud {
    position: fixed;
    top: 20px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
    z-index: 10;
}

.hudBox {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 10px 16px;

    backdrop-filter: blur(8px);
}

.label {
    font-size: 11px;
    opacity: 0.6;
    letter-spacing: 2px;
}

.value {
    font-size: 25px;
    font-weight: bold;
}

#connection {
    position: fixed;
    top: 94px;
    left: 20px;
    width: 190px;
    min-height: 38px;
    padding: 9px 12px;
    border-radius: 12px;
    background: rgba(0,0,0,0.50);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    font-size: 11px;
    display: flex;
    align-items: center;
    z-index: 10;
}

#boostMeter {
    margin-top: 9px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

#boostCircle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
    background: conic-gradient(#ff8a00 360deg, rgba(255,255,255,0.10) 0deg);
    border: 2px solid rgba(255,255,255,0.25);
    box-shadow: 0 0 16px rgba(255,145,20,0.25);
}

#boostSeconds {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(8,10,18,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
}

#boostLabel {
    font-size: 9px;
    letter-spacing: 1.5px;
    opacity: 0.62;
}

#menu {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 20;

    background:
        radial-gradient(circle at center,
        rgba(25,70,130,0.25),
        rgba(0,0,0,0.88));
}

.panel {
    width: min(500px, 90vw);
    padding: 35px;

    text-align: center;

    background: rgba(10,14,25,0.88);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
}

.panel h1 {
    font-size: clamp(32px, 7vw, 60px);
    margin-bottom: 8px;
}

.panel p {
    opacity: 0.65;
    margin-bottom: 25px;
}

button {
    border: 0;
    border-radius: 14px;

    padding: 14px 25px;
    margin: 5px;

    font-size: 16px;
    font-weight: bold;

    color: white;
    background: #1769ff;
}

.secondary {
    background: rgba(255,255,255,0.1);
}

#mobileControls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;

    display: none;
    justify-content: space-between;

    padding: 20px;

    z-index: 15;
}

.controlGroup {
    display: flex;
    gap: 10px;
}

.controlButton {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);

    font-size: 24px;

    user-select: none;
}

#boostButton {
    background: rgba(255,120,20,0.35);
}

#sensorPanel {
    position: fixed;
    bottom: 10px;
    left: 10px;

    font-size: 10px;
    opacity: 0.35;
}

@media (max-width: 700px) {

    #mobileControls {
        display: flex;
    }

    #sensorPanel {
        display: none;
    }

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="hud">

    <div class="hudBox">

        <div class="label">
            SCORE
        </div>

        <div class="value" id="score">
            0
        </div>

    </div>


    <div class="hudBox">

        <div class="label">
            SPEED
        </div>

        <div class="value">
            <span id="speed">0</span>
            KM/H
        </div>

        <div id="boostMeter">
            <div id="boostCircle"><span id="boostSeconds">READY</span></div>
            <div id="boostLabel">BOOST</div>
        </div>

    </div>

</div>


<div id="connection">
    ● DEMO / PUBLIC MODE
</div>


<div id="sensorPanel">

    X: <span id="sx">0</span>
    Y: <span id="sy">0</span>
    AX: <span id="ax">0</span>

</div>


<div id="mobileControls">

    <div class="controlGroup">

        <div class="controlButton" id="left">
            ◀
        </div>

        <div class="controlButton" id="right">
            ▶
        </div>

    </div>


    <div class="controlGroup">

        <div class="controlButton" id="brake">
            ▼
        </div>

        <div class="controlButton" id="gas">
            ▲
        </div>

        <div class="controlButton" id="boostButton">
            ⚡
        </div>

    </div>

</div>


<div id="menu">

    <div class="panel">

        <h1>NEON RUN</h1>

        <p>
            DIY Motion Controller Racing
        </p>

        <button id="startButton">
            START RACE
        </button>

        <button class="secondary"
                id="demoButton">
            DEMO MODE
        </button>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;


function resize() {

    W = canvas.width =
        window.innerWidth;

    H = canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resize
);

resize();


// ==========================
// GAME STATE
// ==========================

let running = false;

let score = 0;
let speed = 0;
let playerX = 0;
let roadOffset = 0;
let lastTime = performance.now();

// Boost: 5 seconds active, then 10 seconds recharge.
let boostReady = true;
let boostActive = false;
let boostTime = 0;
let boostCooldown = 0;
let boostWasDown = false;
const BOOST_DURATION = 5;
const BOOST_COOLDOWN = 10;

// Traffic uses real-world relative-speed logic: traffic travels at 70 km/h.
const TRAFFIC_SPEED = 70;
const TRAFFIC_LANES = [-0.5, 0.5];
let traffic = [];
let trafficSpawnTimer = 0;

// Trees are fixed roadside objects; their apparent motion is driven by player speed.
const trees = [];
for (let i = 0; i < 18; i++) {
    trees.push({
        side: i % 2 === 0 ? -1 : 1,
        distance: 18 + (i * 37) % 150,
        size: 0.85 + ((i * 17) % 40) / 100,
        seed: i * 19.37
    });
}

let cloudOffset = 0;

let controllerConnected = false;

let controller = {
    x: 1900,
    y: 1900,
    sw: 0,
    ax: 0,
    ay: 0,
    az: 0
};

let keyboard = {
    left: false,
    right: false,
    gas: false,
    brake: false,
    boost: false
};


// ==========================
// START
// ==========================

document.getElementById(
    "startButton"
).onclick = () => {

    document.getElementById(
        "menu"
    ).style.display = "none";

    running = true;

};


document.getElementById(
    "demoButton"
).onclick = () => {

    document.getElementById(
        "menu"
    ).style.display = "none";

    running = true;

};


// ==========================
// KEYBOARD
// ==========================

window.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        )
            keyboard.left = true;


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        )
            keyboard.right = true;


        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        )
            keyboard.gas = true;


        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        )
            keyboard.brake = true;


        if (e.code === "Space")
            keyboard.boost = true;

    }
);


window.addEventListener(
    "keyup",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        )
            keyboard.left = false;


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        )
            keyboard.right = false;


        if (
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        )
            keyboard.gas = false;


        if (
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        )
            keyboard.brake = false;


        if (e.code === "Space")
            keyboard.boost = false;

    }
);


// ==========================
// TOUCH CONTROLS
// ==========================

function holdButton(
    id,
    property
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keyboard[property] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        () => {

            keyboard[property] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        () => {

            keyboard[property] = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        () => {

            keyboard[property] = false;

        }
    );

}


holdButton("left", "left");
holdButton("right", "right");
holdButton("gas", "gas");
holdButton("brake", "brake");
holdButton("boostButton", "boost");


// ==========================
// ESP32 CONTROLLER
// ==========================

async function readController() {

    // Only the ESP32's local page
    // can access /data.

    if (
        location.hostname !==
        "192.168.4.1"
    ) {

        document.getElementById(
            "connection"
        ).innerText =
            "● DEMO / PUBLIC MODE";

        return;

    }


    try {

        const response =
            await fetch(
                "/data?t=" +
                Date.now()
            );


        if (!response.ok)
            throw new Error();


        const data =
            await response.json();


        controller = data;

        controllerConnected = true;


        document.getElementById(
            "connection"
        ).innerText =
            "● CONTROLLER CONNECTED";


        document.getElementById(
            "connection"
        ).style.color =
            "#55ff88";


        document.getElementById(
            "sx"
        ).innerText = data.x;


        document.getElementById(
            "sy"
        ).innerText = data.y;


        document.getElementById(
            "ax"
        ).innerText = data.ax;

    }

    catch {

        controllerConnected = false;


        document.getElementById(
            "connection"
        ).innerText =
            "● CONTROLLER DISCONNECTED";


        document.getElementById(
            "connection"
        ).style.color =
            "#ff5555";

    }

}


setInterval(
    readController,
    50
);


// ==========================
// UPDATE
// ==========================

function activateBoost() {
    if (!boostReady || boostActive || boostCooldown > 0) return;

    boostReady = false;
    boostActive = true;
    boostTime = BOOST_DURATION;
}

function updateBoost(dt) {
    const seconds = dt / 60;

    if (boostActive) {
        boostTime -= seconds;
        if (boostTime <= 0) {
            boostTime = 0;
            boostActive = false;
            boostCooldown = BOOST_COOLDOWN;
        }
    } else if (boostCooldown > 0) {
        boostCooldown -= seconds;
        if (boostCooldown <= 0) {
            boostCooldown = 0;
            boostReady = true;
        }
    }

    const circle = document.getElementById("boostCircle");
    const text = document.getElementById("boostSeconds");

    if (boostActive) {
        const fraction = Math.max(0, boostTime / BOOST_DURATION);
        circle.style.background = `conic-gradient(#ff8a00 ${fraction * 360}deg, rgba(255,255,255,0.10) 0deg)`;
        text.innerText = Math.ceil(boostTime) + "s";
    } else if (boostCooldown > 0) {
        const fraction = Math.max(0, boostCooldown / BOOST_COOLDOWN);
        circle.style.background = `conic-gradient(#ff8a00 ${(1 - fraction) * 360}deg, rgba(255,255,255,0.10) 0deg)`;
        text.innerText = Math.ceil(boostCooldown) + "s";
    } else {
        circle.style.background = "conic-gradient(#ff8a00 360deg, rgba(255,255,255,0.10) 0deg)";
        text.innerText = "READY";
    }
}

function spawnTraffic() {
    // Keep a safe visual gap: never spawn directly beside a nearby car.
    const lane = TRAFFIC_LANES[Math.random() < 0.5 ? 0 : 1];
    traffic.push({
        lane,
        distance: 105 + Math.random() * 65,
        width: 0.82 + Math.random() * 0.28,
        height: 1.0 + Math.random() * 0.20,
        seed: Math.random() * 1000
    });
}

function updateTraffic(dt) {
    const seconds = dt / 60;
    const playerMps = speed / 3.6;
    const trafficMps = TRAFFIC_SPEED / 3.6;

    trafficSpawnTimer -= seconds;

    if (trafficSpawnTimer <= 0 && traffic.length < 2) {
        // If one car is close, wait before adding another so the other lane remains usable.
        const nearest = traffic.length ? Math.min(...traffic.map(c => c.distance)) : 999;
        if (nearest > 45) {
            spawnTraffic();
            trafficSpawnTimer = 2.8 + Math.random() * 2.0;
        } else {
            trafficSpawnTimer = 0.8;
        }
    }

    for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        // Positive value means the player is closing on the 70 km/h traffic car.
        car.distance -= (playerMps - trafficMps) * seconds;

        if (car.distance > 190 || car.distance < 4) {
            traffic.splice(i, 1);
        }
    }
}

function update(dt) {
    let steering = 0;
    let accelerating = false;
    let braking = false;

    if (controllerConnected) {
        // IMPORTANT: the physical joystick is rotated relative to the old mapping.
        // Left = accelerate, Right = brake, Up = steer right, Down = steer left.
        if (controller.x < 1600)
            accelerating = true;
        else if (controller.x > 2200)
            braking = true;

        if (controller.y < 1650)
            steering = 1;
        else if (controller.y > 2200)
            steering = -1;

        // More sensitive tilt. The previous mapping was backwards, so invert it.
        let tilt = -(controller.ax || 0) / 3000;
        const tiltDeadzone = 0.12;
        if (Math.abs(tilt) < tiltDeadzone)
            tilt = 0;
        else
            tilt = Math.sign(tilt) * (Math.abs(tilt) - tiltDeadzone) / (1 - tiltDeadzone);

        steering += tilt * 1.35;
    }

    if (keyboard.left) steering -= 1;
    if (keyboard.right) steering += 1;
    if (keyboard.gas) accelerating = true;
    if (keyboard.brake) braking = true;

    const boostDown = !!controller.sw || keyboard.boost;
    if (boostDown && !boostWasDown)
        activateBoost();
    boostWasDown = boostDown;

    steering = Math.max(-1, Math.min(1, steering));

    // Slower normal acceleration, unchanged boost acceleration, stronger braking.
    if (accelerating)
        speed += 0.18 * dt;
    else
        speed -= 0.075 * dt;

    if (braking)
        speed -= 0.95 * dt;

    if (boostActive)
        speed += 0.55 * dt;

    speed = Math.max(0, Math.min(220, speed));

    // Faster lateral response so a small tilt produces a noticeable lane change.
    playerX += steering * (0.020 + speed / 9000) * dt;
    playerX *= 0.982;
    playerX = Math.max(-0.72, Math.min(0.72, playerX));

    roadOffset += speed * dt * 0.055;
    cloudOffset += (0.002 + speed * 0.000004) * dt;

    updateBoost(dt);
    updateTraffic(dt);

    score += speed * dt * 0.015;

    document.getElementById("score").innerText = Math.floor(score);
    document.getElementById("speed").innerText = Math.floor(speed);
}


// ==========================
// SKY
// ==========================

function drawSky() {
    const horizon = H * 0.42;

    const gradient = ctx.createLinearGradient(0, 0, 0, horizon);
    gradient.addColorStop(0, "#172b55");
    gradient.addColorStop(0.42, "#5b6684");
    gradient.addColorStop(0.72, "#d18a58");
    gradient.addColorStop(1, "#f3b34f");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, horizon + 2);

    // Animated late-afternoon sun: warm orange/yellow light source.
    const t = performance.now() * 0.00008;
    const sunX = W * 0.76 + Math.sin(t) * W * 0.012;
    const sunY = horizon * 0.76 + Math.sin(t * 0.7) * 2;

    const glow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, Math.min(W, H) * 0.28);
    glow.addColorStop(0, "rgba(255,244,175,0.95)");
    glow.addColorStop(0.08, "rgba(255,205,82,0.55)");
    glow.addColorStop(0.35, "rgba(255,145,40,0.18)");
    glow.addColorStop(1, "rgba(255,120,20,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, horizon + 80);

    ctx.beginPath();
    ctx.arc(sunX, sunY, Math.min(W, H) * 0.035, 0, Math.PI * 2);
    ctx.fillStyle = "#fff2a3";
    ctx.shadowColor = "rgba(255,155,30,0.75)";
    ctx.shadowBlur = 35;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Soft animated clouds.
    const clouds = [
        {x:0.12, y:0.16, s:1.0, a:0.22},
        {x:0.39, y:0.23, s:0.75, a:0.18},
        {x:0.62, y:0.11, s:1.25, a:0.16},
        {x:0.87, y:0.28, s:0.90, a:0.20}
    ];

    for (const c of clouds) {
        const x = ((c.x * W + cloudOffset * W * 0.18) % (W * 1.25)) - W * 0.12;
        const y = c.y * horizon;
        const s = c.s * Math.min(W, H) / 700;

        ctx.fillStyle = `rgba(255,238,218,${c.a})`;
        ctx.beginPath();
        ctx.ellipse(x, y, 75*s, 18*s, 0, 0, Math.PI*2);
        ctx.ellipse(x-45*s, y+3*s, 45*s, 14*s, 0, 0, Math.PI*2);
        ctx.ellipse(x+45*s, y+5*s, 52*s, 15*s, 0, 0, Math.PI*2);
        ctx.fill();
    }
}


// ==========================
// ROAD
// ==========================

function drawRoad() {
    const horizon = H * 0.42;

    // Ground catches some of the sunset warmth.
    const ground = ctx.createLinearGradient(0, horizon, 0, H);
    ground.addColorStop(0, "#17301d");
    ground.addColorStop(1, "#06130b");
    ctx.fillStyle = ground;
    ctx.fillRect(0, horizon, W, H - horizon);

    // Two-lane road. No centre driving lane.
    ctx.fillStyle = "#25292f";
    ctx.beginPath();
    ctx.moveTo(W * 0.46, horizon);
    ctx.lineTo(W * 0.54, horizon);
    ctx.lineTo(W * 0.95, H);
    ctx.lineTo(W * 0.05, H);
    ctx.closePath();
    ctx.fill();

    // Warm sunset wash on the road.
    const roadLight = ctx.createLinearGradient(W * 0.78, horizon, W * 0.5, H);
    roadLight.addColorStop(0, "rgba(255,178,75,0.28)");
    roadLight.addColorStop(0.45, "rgba(255,145,50,0.10)");
    roadLight.addColorStop(1, "rgba(255,120,30,0)");
    ctx.fillStyle = roadLight;
    ctx.beginPath();
    ctx.moveTo(W * 0.46, horizon);
    ctx.lineTo(W * 0.54, horizon);
    ctx.lineTo(W * 0.95, H);
    ctx.lineTo(W * 0.05, H);
    ctx.closePath();
    ctx.fill();

    // Road edges.
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(W * 0.46, horizon);
    ctx.lineTo(W * 0.05, H);
    ctx.moveTo(W * 0.54, horizon);
    ctx.lineTo(W * 0.95, H);
    ctx.stroke();

    // Only one lane divider: two lanes, not three.
    const centerX = W / 2;
    for (let i = 0; i < 16; i++) {
        const p = ((i / 16) + (roadOffset % 1) / 16) % 1;
        const y = horizon + Math.pow(p, 2) * (H - horizon);
        const width = 2 + p * 10;
        const height = 5 + p * 38;

        ctx.fillStyle = "#f3f3f0";
        ctx.fillRect(centerX - width / 2, y, width, height);
    }

    // High-speed edge streaks reinforce optic flow.
    const streakCount = Math.floor(8 + speed * 0.10);
    ctx.lineCap = "round";
    for (let i = 0; i < streakCount; i++) {
        const p = ((i * 0.137 + roadOffset * 0.018) % 1);
        const y = horizon + Math.pow(p, 2) * (H - horizon);
        const side = i % 2 === 0 ? -1 : 1;
        const x = W/2 + side * (W * (0.25 + p * 0.34));
        const len = (5 + p * 55) * (speed / 220);
        ctx.strokeStyle = `rgba(255,210,130,${0.08 + p * 0.16})`;
        ctx.lineWidth = 1 + p * 2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - side * len * 0.22, y + len);
        ctx.stroke();
    }
}


// ==========================
// OBJECTS
// ==========================

function treeScreenPosition(tree, horizon) {
    const p = Math.max(0, Math.min(1, 1 - tree.distance / 175));
    const y = horizon + Math.pow(p, 2) * (H - horizon);
    const sideX = W * (0.26 + p * 0.34);
    const x = W / 2 + tree.side * sideX;
    const scale = (0.18 + p * 1.20) * tree.size;
    return {p, x, y, scale};
}

function drawTree(tree) {
    const horizon = H * 0.42;
    const pos = treeScreenPosition(tree, horizon);
    if (pos.p <= 0.01) return;

    const s = pos.scale * Math.min(W, H) / 520;
    const trunkH = 95 * s;
    const trunkW = Math.max(3, 16 * s);

    // Shadow on the ground.
    ctx.fillStyle = "rgba(0,0,0,0.20)";
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y + 5*s, 32*s, 9*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Trunk.
    const trunk = ctx.createLinearGradient(pos.x - trunkW, 0, pos.x + trunkW, 0);
    trunk.addColorStop(0, "#4d2b18");
    trunk.addColorStop(0.5, "#9a5b2f");
    trunk.addColorStop(1, "#3b2115");
    ctx.fillStyle = trunk;
    ctx.fillRect(pos.x - trunkW/2, pos.y - trunkH, trunkW, trunkH);

    // Layered foliage for a more natural silhouette.
    const leafY = pos.y - trunkH;
    const r = 38 * s;
    const sway = Math.sin(performance.now()*0.001 + tree.seed) * 2*s;
    const leaf = ctx.createRadialGradient(pos.x + sway - r*0.25, leafY-r*0.3, r*0.15, pos.x+sway, leafY, r*1.5);
    leaf.addColorStop(0, "#7fbd63");
    leaf.addColorStop(0.45, "#397b42");
    leaf.addColorStop(1, "#153d28");
    ctx.fillStyle = leaf;

    ctx.beginPath();
    ctx.arc(pos.x+sway, leafY-r*0.30, r*0.78, 0, Math.PI*2);
    ctx.arc(pos.x-r*0.65+sway, leafY+r*0.05, r*0.65, 0, Math.PI*2);
    ctx.arc(pos.x+r*0.65+sway, leafY+r*0.05, r*0.68, 0, Math.PI*2);
    ctx.arc(pos.x+sway, leafY+r*0.34, r*0.72, 0, Math.PI*2);
    ctx.fill();

    // Sunset highlight.
    ctx.fillStyle = "rgba(255,185,85,0.14)";
    ctx.beginPath();
    ctx.arc(pos.x-r*0.25+sway, leafY-r*0.20, r*0.42, 0, Math.PI*2);
    ctx.fill();
}

function drawTrees(dt) {
    const seconds = dt / 60;
    // 220 km/h = 61.1 m/s. This converts the game's km/h to roadside-world motion.
    // The apparent screen speed then comes from perspective, not an arbitrary fixed speed.
    const playerMps = speed / 3.6;

    for (const tree of trees) {
        tree.distance -= playerMps * seconds;
        if (tree.distance < 5) {
            tree.distance = 150 + Math.random() * 50;
            tree.side = Math.random() < 0.5 ? -1 : 1;
            tree.size = 0.78 + Math.random() * 0.50;
        }
    }

    const ordered = [...trees].sort((a,b) => b.distance - a.distance);
    for (const tree of ordered)
        drawTree(tree);
}

function drawTrafficCar(car) {
    const horizon = H * 0.42;
    const p = Math.max(0.02, Math.min(1, 1 - car.distance / 180));
    const y = horizon + Math.pow(p, 2) * (H - horizon);
    const laneX = W / 2 + car.lane * (W * (0.10 + p * 0.34));
    const scale = (0.16 + p * 0.95) * car.width;
    const w = Math.max(8, 38 * scale);
    const h = Math.max(14, 68 * scale * car.height);

    ctx.save();
    ctx.translate(laneX, y - h * 0.5);

    ctx.fillStyle = "rgba(0,0,0,0.30)";
    ctx.beginPath();
    ctx.ellipse(0, h*0.55, w*0.75, h*0.16, 0, 0, Math.PI*2);
    ctx.fill();

    const red = ctx.createLinearGradient(-w/2, 0, w/2, 0);
    red.addColorStop(0, "#7b1017");
    red.addColorStop(0.45, "#ef3035");
    red.addColorStop(1, "#7b1017");
    ctx.fillStyle = red;
    ctx.beginPath();
    ctx.roundRect(-w/2, -h/2, w, h, Math.max(2, w*0.18));
    ctx.fill();

    // Roof/cabin makes it unmistakably a car instead of a red rectangle.
    ctx.fillStyle = "#341014";
    ctx.beginPath();
    ctx.moveTo(-w*0.30, -h*0.42);
    ctx.lineTo(w*0.30, -h*0.42);
    ctx.lineTo(w*0.22, -h*0.05);
    ctx.lineTo(-w*0.22, -h*0.05);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#aee6ff";
    ctx.fillRect(-w*0.18, -h*0.34, w*0.36, h*0.13);

    ctx.fillStyle = "#ffb4a0";
    ctx.fillRect(-w*0.38, h*0.25, w*0.16, h*0.10);
    ctx.fillRect(w*0.22, h*0.25, w*0.16, h*0.10);

    ctx.restore();
}

function drawTraffic() {
    const ordered = [...traffic].sort((a,b) => b.distance - a.distance);
    for (const car of ordered)
        drawTrafficCar(car);
}


// ==========================
// PLAYER CAR
// ==========================

function drawCar() {

    const x =
        W / 2 +
        playerX *
        W *
        0.25;


    const y =
        H * 0.78;


    const width = 80;
    const height = 135;


    ctx.save();

    ctx.translate(
        x,
        y
    );


    // Shadow

    ctx.fillStyle =
        "rgba(0,0,0,0.5)";


    ctx.beginPath();

    ctx.ellipse(
        0,
        60,
        60,
        18,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Car body

    const gradient =
        ctx.createLinearGradient(
            -width / 2,
            0,
            width / 2,
            0
        );


    gradient.addColorStop(
        0,
        "#144dff"
    );


    gradient.addColorStop(
        0.5,
        "#36c8ff"
    );


    gradient.addColorStop(
        1,
        "#144dff"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.roundRect(
        -width / 2,
        -height / 2,
        width,
        height,
        18
    );

    ctx.fill();


    // Windshield

    ctx.fillStyle =
        "#06111e";


    ctx.beginPath();

    ctx.moveTo(
        -28,
        -35
    );

    ctx.lineTo(
        28,
        -35
    );

    ctx.lineTo(
        20,
        5
    );

    ctx.lineTo(
        -20,
        5
    );

    ctx.closePath();

    ctx.fill();


    // Lights

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        -32,
        35,
        18,
        8
    );


    ctx.fillRect(
        14,
        35,
        18,
        8
    );


    ctx.restore();

}


// ==========================
// GAME LOOP
// ==========================

function loop(now) {

    const dt =
        Math.min(
            (now - lastTime) /
            16.67,
            3
        );


    lastTime = now;


    if (running)
        update(dt);


    drawSky();

    drawRoad();

    drawTrees(dt);
    drawTraffic();

    drawCar();


    requestAnimationFrame(
        loop
    );

}


requestAnimationFrame(
    loop
);

</script>
